<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Embutido</title>
    <style>
        em{
            color: cadetblue; text-decoration: double;
        }
       code{
        color: forestgreen; text-decoration: underline;
        }
        body > main > ol > li:nth-child(2){
            color:chartreuse;
            background-color: darkblue;
        }
    </style>
</head>
<body>
    <main>
        <h1>DCC202 CSS Embutido</h1>
        <p>o estilo <em >Embutido</em> é aplicado diretamente no elemento dia atributo <code >style</code>.</p>
        <ol>
            <li>teste 1 </li>
            <li>teste 2</li>
        </ol>
    </main>
</body>
</html>
